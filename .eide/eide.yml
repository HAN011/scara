version: "4.1"
name: basic_framework
type: ARM
deviceName: null
packDir: null
srcDirs:
  - Startup
  - Src
  - Middlewares
  - Drivers
  - application
  - bsp
  - Inc
  - modules
virtualFolder:
  name: <virtual_root>
  files: []
  folders: []
dependenceList: []
outDir: build
miscInfo:
  uid: f57851e3bfe199850bc4c4ca027842fb
targets:
  Debug:
    cppPreprocessAttrs:
      defineList:
        - DEBUG
        - USE_HAL_DRIVER
        - STM32F407xx
        - ARM_MATH_CM4
      incList:
        - Inc
        - Drivers/STM32F4xx_HAL_Driver/Inc
        - Drivers/STM32F4xx_HAL_Driver/Inc/Legacy
        - Middlewares/Third_Party/FreeRTOS/Source/include
        - Middlewares/Third_Party/FreeRTOS/Source/portable/GCC/ARM_CM4F
        - Middlewares/ST/STM32_USB_Device_Library/Core/Inc
        - Middlewares/ST/STM32_USB_Device_Library/Class/CDC/Inc
        - Drivers/CMSIS/Device/ST/STM32F4xx/Include
        - Drivers/CMSIS/Include
        - Middlewares/ST/ARM/DSP/Inc
        - Middlewares/Third_Party/FreeRTOS/Source/CMSIS_RTOS_V2
        - application
        - application/test
        - application/test/decode
        - application/test/decode/Inc
        - application/test/decode/Src
        - bsp/adc
        - bsp
        - bsp/can
        - bsp/dwt
        - bsp/flash
        - bsp/gpio
        - bsp/iic
        - bsp/log
        - bsp/pwm
        - bsp/spi
        - bsp/usart
        - bsp/usb
        - modules/algorithm
        - modules
        - modules/BMI088
        - modules/buzzer
        - modules/can_comm
        - modules/daemon
        - modules/encoder
        - modules/externcmd
        - modules/imu
        - modules/ist8310
        - modules/led
        - modules/master_machine
        - modules/message_center
        - modules/motor
        - modules/power_control
        - modules/referee
        - modules/remote
        - modules/standard_cmd
        - modules/super_cap
        - modules/TFminiPlus
        - modules/tool
        - modules/unicomm
        - modules/vofa
        - Middlewares/Third_Party/SEGGER/RTT
        - Middlewares/Third_Party/SEGGER/Config
        - modules/motor/DJImotor
        - modules/motor/servo_motor
        - modules/motor/DRmotor
        - modules/motor/LKmotor
        - modules/motor/HTmotor
        - modules/motor/step_motor
      libList:
        - Middlewares/ST/ARM/DSP/Lib
        - modules/algorithm
    excludeList: []
    toolchain: GCC
    toolchainConfigMap:
      GCC:
        archExtensions: ""
        cpuType: Cortex-M4
        floatingPointHardware: single
        options:
          version: 5
          afterBuildTasks: []
          asm-compiler:
            ASM_FLAGS: -DDEBUG
          beforeBuildTasks: []
          c/cpp-compiler:
            language-c: gnu11
            language-cpp: c++11
            one-elf-section-per-data: true
            one-elf-section-per-function: true
            optimization: level-2
            warnings: all-warnings
          global:
            $float-abi-type: hard
            not-use-syscalls: true
            output-debug-info: enable
            use-newlib-nano: true
          linker:
            $outputTaskExcludes:
              - .bin
            $toolName: auto
            LIB_FLAGS: -l:libarm_cortexM4lf_math.a
            output-format: elf
            remove-unused-input-sections: true
        scatterFilePath: STM32F407IGHX_FLASH.ld
        storageLayout:
          RAM: []
          ROM: []
        useCustomScatterFile: true
    uploadConfigMap:
      JLink:
        baseAddr: ""
        bin: ""
        cpuInfo:
          cpuName: "null"
          vendor: "null"
        otherCmds: ""
        proType: 1
        speed: 8000
    uploader: JLink
  Release:
    cppPreprocessAttrs:
      defineList:
        - USE_HAL_DRIVER
        - STM32F407xx
      incList:
        - Inc
        - Drivers/STM32F4xx_HAL_Driver/Inc
        - Drivers/STM32F4xx_HAL_Driver/Inc/Legacy
        - Middlewares/Third_Party/FreeRTOS/Source/include
        - Middlewares/Third_Party/FreeRTOS/Source/portable/GCC/ARM_CM4F
        - Middlewares/ST/STM32_USB_Device_Library/Core/Inc
        - Middlewares/ST/STM32_USB_Device_Library/Class/CDC/Inc
        - Drivers/CMSIS/Device/ST/STM32F4xx/Include
        - Drivers/CMSIS/Include
        - Middlewares/ST/ARM/DSP/Inc
        - Middlewares/Third_Party/FreeRTOS/Source/CMSIS_RTOS_V2
      libList:
        - Middlewares/ST/ARM/DSP/Lib
    excludeList: []
    toolchain: GCC
    toolchainConfigMap:
      GCC:
        archExtensions: ""
        cpuType: Cortex-M4
        floatingPointHardware: single
        options:
          version: 5
          afterBuildTasks: []
          asm-compiler:
            ASM_FLAGS: ""
          beforeBuildTasks: []
          c/cpp-compiler:
            CXX_FLAGS: ""
